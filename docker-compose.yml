version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: otters_db
    environment:
      POSTGRES_USER: otters
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: otters_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: