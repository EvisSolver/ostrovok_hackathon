limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;   # общий лимит запросов с одного IP

server {
  listen 80;
  resolver 127.0.0.11 valid=5s;          # DNS Docker: имя "api" -> адреса всех реплик, обновляется каждые 5 с

  location /api/ {
    set $upstream http://api:8000;
    limit_req zone=api burst=20 nodelay;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;                  # без этого стриминг токенов задерживается
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout http_502 http_503;   # упавшая реплика -> запрос уходит на другую
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
